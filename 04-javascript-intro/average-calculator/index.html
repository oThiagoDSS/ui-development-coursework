<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Average Calculator</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Average Calculator</h1>

      <label for="grade1">Grade 1:</label>
      <input id="grade1" type="number" min="0" max="10" step="0.1" />

      <label for="grade2">Grade 2:</label>
      <input id="grade2" type="number" min="0" max="10" step="0.1" />

      <label for="grade3">Grade 3:</label>
      <input id="grade3" type="number" min="0" max="10" step="0.1" />

      <button id="calculate" type="button">Calculate</button>

      <p id="result" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
