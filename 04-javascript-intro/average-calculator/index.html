<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Average Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Average Calculator</h1>
      <p class="subtitle">Enter the student's name and three grades (0 to 10).</p>

      <form id="average-form" novalidate>
        <label for="student-name">Student Name</label>
        <input
          type="text"
          id="student-name"
          autocomplete="name"
          placeholder="e.g., Mariana Silva"
        />

        <label for="grade1">Grade 1</label>
        <input
          type="number"
          id="grade1"
          min="0"
          max="10"
          step="0.1"
          placeholder="0.0 to 10.0"
        />

        <label for="grade2">Grade 2</label>
        <input
          type="number"
          id="grade2"
          min="0"
          max="10"
          step="0.1"
          placeholder="0.0 to 10.0"
        />

        <label for="grade3">Grade 3</label>
        <input
          type="number"
          id="grade3"
          min="0"
          max="10"
          step="0.1"
          placeholder="0.0 to 10.0"
        />

        <div class="button-group">
          <button type="submit">Calculate Average</button>
          <button type="reset" id="clear">Clear</button>
        </div>
      </form>

      <section id="result" class="result" role="status" aria-live="polite">
        The result will be displayed here.
      </section>
    </main>
  </body>
</html>
