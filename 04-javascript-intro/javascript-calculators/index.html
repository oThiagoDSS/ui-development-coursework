<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main Calculator Section -->
    <main class="container">
      <h1>JavaScript Calculator</h1>

      <label for="number1">First Number:</label>
      <input type="number" id="number1" placeholder="Enter a number" />

      <label for="number2">Second Number:</label>
      <input type="number" id="number2" placeholder="Enter a number" />

      <button id="calculateBtn">Calculate</button>

      <section id="result" aria-live="polite">
        Results will appear here.
      </section>
    </main>

    <!-- Lab 3 - Challenge: Grade Average Calculator -->
    <section class="container">
      <h1>Grade Average Calculator</h1>

      <label for="grade1">Grade 1:</label>
      <input type="number" id="grade1" min="0" max="10" step="0.1" />

      <label for="grade2">Grade 2:</label>
      <input type="number" id="grade2" min="0" max="10" step="0.1" />

      <label for="grade3">Grade 3:</label>
      <input type="number" id="grade3" min="0" max="10" step="0.1" />

      <button id="calculateAverageBtn">Calculate Average</button>

      <div id="averageResult" aria-live="polite"></div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
